<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>LuxuryStay Hotel</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav>
    <h2>LuxuryStay Hotel</h2>
    <ul>
        <li><a href="#">Home</a></li>
        <li><a href="#rooms">Rooms</a></li>
        <li><a href="#booking">Booking</a></li>
    </ul>
</nav>

<section class="hero">
    <h1>Welcome to LuxuryStay Hotel</h1>
</section>

<section class="section" id="rooms">
    <h2>Our Rooms</h2>
    <div class="rooms">
        
        <div class="room-card">
            <img src="https://images.unsplash.com/photo-1501117716987-c8e1ecb2104e">
            <div class="content">
                <h3>Deluxe Room</h3>
                <p>₹4000 / Night</p>
                <button onclick="selectRoom('Deluxe Room')">Book Now</button>
            </div>
        </div>

        <div class="room-card">
            <img src="https://images.unsplash.com/photo-1560448204-e02f11c3d0e2">
            <div class="content">
                <h3>Executive Room</h3>
                <p>₹6000 / Night</p>
                <button onclick="selectRoom('Executive Room')">Book Now</button>
            </div>
        </div>

        <div class="room-card">
            <img src="https://images.unsplash.com/photo-1590490360182-c33d57733427">
            <div class="content">
                <h3>Suite Room</h3>
                <p>₹9000 / Night</p>
                <button onclick="selectRoom('Suite Room')">Book Now</button>
            </div>
        </div>

    </div>
</section>

<section class="section" id="booking">
    <h2>Book a Room</h2>
    <div class="form-container">
        <form id="bookingForm">
            <input type="text" id="name" placeholder="Your Name" required>
            <input type="email" id="email" placeholder="Your Email" required>
            <select id="roomType" required>
                <option value="">Select Room</option>
                <option>Deluxe Room</option>
                <option>Executive Room</option>
                <option>Suite Room</option>
            </select>
            <input type="date" id="checkin" required>
            <input type="date" id="checkout" required>
            <button type="submit">Confirm Booking</button>
        </form>
    </div>

    <div class="dashboard" id="dashboard">
        <h3>Booking Details</h3>
        <p id="details"></p>
    </div>
</section>

<footer>
    © 2026 LuxuryStay Hotel | All Rights Reserved
</footer>

<script src="script.js"></script>
</body>
</html>
